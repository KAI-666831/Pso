<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="收銀">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>快速收銀</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --mute:#7a776f; --line:#e6e2d8;
    --accent:#0f6e5a; --accent-ink:#fff; --warn:#b4432f; --soft:#e8f2ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font:inherit}
  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  .sync{font-size:12px;color:var(--mute)}
  .sync.bad{color:var(--warn)}
  nav{display:flex;gap:6px;padding:0 12px 10px}
  nav button{flex:1;padding:10px 0;border-radius:10px;background:#ebe7dd;font-weight:600;font-size:15px}
  nav button.on{background:var(--ink);color:#fff}
  main{flex:1;padding:0 12px 24px}
  .view{display:none}.view.on{display:block}

  /* register */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;min-height:74px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}
  .prod:active{transform:scale(.97);background:var(--soft)}
  .prod .n{font-weight:600;font-size:15px;line-height:1.25;word-break:break-all}
  .prod .p{color:var(--mute);font-size:13px;margin-top:3px}
  .prod .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:999px;
    min-width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .prod.custom{border-style:dashed;color:var(--mute)}
  .shiftbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .shiftbar::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:15px;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.add{color:var(--mute);border-style:dashed}
  .shiftlbl{font-size:12px;color:var(--mute);margin:0 2px 4px}
  .sitem{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .sitem input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600}
  .sitem .x{width:auto;min-width:36px;height:38px;padding:0 8px;border-radius:8px;color:var(--warn);background:#f8ece9;font-weight:700}
  .newshift{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
  .newshift input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .newshift label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin-bottom:10px}
  .newshift label input{width:20px;height:20px}
  .newshift button{width:100%;padding:12px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
  .syncbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .syncbox input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:16px}
  .syncbox .row{display:flex;gap:8px}
  .syncbox .row button{flex:1}
  .syncbox p{margin:0 0 10px;font-size:14px;color:var(--mute);line-height:1.5}
  .syncbox .st{font-size:15px;margin-bottom:10px;line-height:1.6}
  .tabs2{display:flex;gap:6px;margin-bottom:10px}
  .tabs2 button{flex:1;padding:9px 0;border-radius:9px;background:#f0ede6;font-weight:600}
  .tabs2 button.on{background:var(--ink);color:#fff}
  .note{background:var(--soft);border-radius:12px;padding:12px;font-size:14px;line-height:1.5;margin-bottom:10px}
  .sec-h{font-size:13px;font-weight:700;color:var(--mute);margin:14px 4px 6px;letter-spacing:1px}
  .sec-h:first-child{margin-top:2px}
  .cat-h{display:flex;align-items:center;gap:6px;margin:16px 0 6px}
  .cat-h input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-weight:700;background:#efece4}
  .cat-h span{flex:1;font-weight:700;padding:9px 4px;color:var(--mute)}
  .cat-h button{width:34px;height:36px;border-radius:8px;background:#ebe7dd}
  .cat-h .x{color:var(--warn);background:#f8ece9;font-weight:700;width:auto;min-width:34px;padding:0 8px}
  .pitem select{padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:84px;font-size:14px}
  .pform select{flex:1 1 100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
  .addcat{display:flex;gap:8px;margin-top:14px}
  .addcat input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px}
  .addcat button{padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--mute)}
  .empty button{margin-top:10px}

  .cart{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cart-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
  .line{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);gap:8px}
  .line .nm{flex:1;min-width:0}
  .line .nm small{color:var(--mute);display:block}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:32px;height:32px;border-radius:8px;background:#f0ede6;font-size:18px;font-weight:700}
  .qty span{min-width:22px;text-align:center;font-weight:600}
  .line .sub{width:72px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px}
  .total b{font-size:30px;font-variant-numeric:tabular-nums}
  .pay{padding:0 14px 14px}
  .pay-row{display:flex;gap:8px;align-items:center}
  .pay-row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:20px;font-variant-numeric:tabular-nums}
  .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .quick button{flex:1;min-width:60px;padding:9px 0;border-radius:9px;background:#f0ede6;font-weight:600;font-size:14px}
  .change{margin-top:10px;display:flex;justify-content:space-between;font-size:17px}
  .change b{font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
  .change.short b{color:var(--warn)}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;margin-top:12px}
  .btn:disabled{opacity:.35}
  .btn.sec{background:#ebe7dd;color:var(--ink);font-size:15px;padding:11px}
  .link{color:var(--mute);font-size:13px;text-decoration:underline}

  /* stats */
  .daybar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .daybar button{width:40px;height:40px;border-radius:10px;background:#ebe7dd;font-size:18px}
  .daybar input{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi small{color:var(--mute);font-size:12px}
  .kpi b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi.big{grid-column:1/-1}.kpi.big b{font-size:32px;color:var(--accent)}
  .sec-t{font-size:14px;color:var(--mute);margin:16px 2px 6px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
  th{font-size:12px;color:var(--mute);font-weight:600;background:#faf9f5}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:4px;background:var(--soft);border-radius:2px;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .order{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .order .top{display:flex;justify-content:space-between;font-weight:600}
  .order .its{color:var(--mute);font-size:13px;margin-top:3px}
  .order .del{color:var(--warn);font-size:13px;margin-top:6px}

  /* products */
  .pform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap}
  .pform input{padding:11px;border:1px solid var(--line);border-radius:10px;min-width:0}
  .pform .nmi{flex:2 1 140px}.pform .pri{flex:1 1 80px}
  .pform button{flex:1 1 100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
  .plist{margin-top:10px}
  .pitem{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
  .pitem input{padding:8px;border:1px solid var(--line);border-radius:8px;min-width:0}
  .pitem .nmi{flex:2}.pitem .pri{flex:1;max-width:96px}
  .pitem .mv{width:30px;height:34px;border-radius:8px;background:#f0ede6}
  .pitem .x{width:34px;height:34px;border-radius:8px;color:var(--warn);background:#f8ece9;font-weight:700}

  /* modal + toast */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px 24px}
  .sheet h3{margin:0 0 12px}
  .sheet input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:17px}
  .sheet .row{display:flex;gap:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:15px;transition:transform .25s;z-index:20;white-space:nowrap}
  .toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>快速收銀</h1>
    <span class="sync" id="sync"></span>
  </header>
  <nav>
    <button data-v="reg" class="on">收銀</button>
    <button data-v="stat">今日統計</button>
    <button data-v="prod">設定 / 備份</button>
  </nav>
  <main>
    <!-- 收銀 -->
    <section class="view on" id="v-reg">
      <div class="shiftbar" data-bar="reg"></div>
      <div id="grid"></div>
      <div class="cart" id="cart"></div>
    </section>

    <!-- 統計 -->
    <section class="view" id="v-stat">
      <div class="daybar">
        <button id="dPrev">‹</button>
        <input type="date" id="dPick">
        <button id="dNext">›</button>
      </div>
      <div id="stat"></div>
    </section>

    <!-- 商品 -->
    <section class="view" id="v-prod">
      <div class="note" id="staffNote" hidden>商品和價格由老闆統一設定，會自動更新。<br>要臨時加品項，請在收銀頁用「＋ 自訂」。</div>
      <div id="adminOnly">
      <div class="shiftlbl">正在編輯這個班別的商品：</div>
      <div class="shiftbar" data-bar="prod"></div>
      <form class="pform" id="pform">
        <input class="nmi" id="pName" placeholder="商品名稱" autocomplete="off">
        <input class="pri" id="pPrice" placeholder="價格" inputmode="numeric" autocomplete="off">
        <select id="pCat"></select>
        <button type="submit">＋ 新增商品</button>
      </form>
      <div class="plist" id="plist"></div>
      <div class="sec-t">班別管理（點名稱可改名）</div>
      <div id="shiftlist"></div>
      <form class="newshift" id="newshift">
        <input type="text" id="nsName" placeholder="新班別名稱，例如：白帶班" autocomplete="off">
        <label><input type="checkbox" id="nsCopy" checked> 複製目前班別的商品和區塊</label>
        <button type="submit">＋ 新增班別</button>
      </form>
      </div>
      <div class="sec-t">雲端同步（Google 試算表）</div>
      <div class="syncbox" id="syncbox"></div>
      <div class="sec-t">備份（沒開雲端同步時，建議每週備份一次）</div>
      <button class="btn sec" id="bkBtn">備份全部資料（存到檔案 / 傳 LINE）</button>
      <button class="btn sec" id="csvBtn" style="margin-top:8px">匯出銷售明細 Excel（CSV）</button>
      <button class="btn sec" id="rsBtn" style="margin-top:8px">從備份檔還原</button>
      <input type="file" id="rsFile" accept=".json,application/json" hidden>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>自訂品項</h3>
    <input id="cName" placeholder="名稱（可留空）" autocomplete="off">
    <input id="cPrice" placeholder="金額" inputmode="numeric" autocomplete="off">
    <div class="row">
      <button class="btn sec" id="cCancel">取消</button>
      <button class="btn sec" id="cOk" style="background:var(--accent);color:#fff">加入</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const money = n => 'NT$' + Math.round(n).toLocaleString('zh-TW');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  // ---------- state ----------
  let products = [];      // {id,name,price}
  let cart = [];          // {key,name,price,qty}
  let paid = '';
  let viewDay = dayKey(new Date());
  let dayOrders = [];     // orders for viewDay
  

  // ---------- storage: this phone only (works fully offline) ----------
  const LS = {
    ok: (() => { try { localStorage.setItem('pos:t','1'); localStorage.removeItem('pos:t'); return true; } catch(e){ return false; } })(),
    get(k, d){ try { const v = localStorage.getItem('pos:'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem('pos:'+k, JSON.stringify(v)); return true; } catch(e){ return false; } }
  };
  function setSync(){
    const el = $('#sync');
    const lastBk = LS.get('lastBackup', 0);
    const days = lastBk ? Math.floor((Date.now() - lastBk) / 86400000) : null;
    if (!LS.ok) { el.textContent = '⚠︎ 無法儲存'; el.classList.add('bad'); return; }
    if (sync) {
      el.textContent = queue.length ? `${flushing ? '上傳中' : '已存手機'} · ${queue.length} 筆待上傳` : (syncErr ? '已存手機 · 雲端連不上' : '☁︎ 已同步');
      el.classList.toggle('bad', !!syncErr && queue.length > 0); return;
    }
    el.textContent = days === null ? '已存手機 · 尚未備份' : (days >= 7 ? `已存手機 · ${days} 天沒備份` : '已存手機');
    el.classList.toggle('bad', days === null || days >= 7);
  }
  function localDay(date){ return LS.get('day:' + date, []); }
  function setLocalDay(date, arr){ return LS.set('day:' + date, arr); }
  function refreshDay(){
    let list = localDay(viewDay);
    if (useCloudStats() && cloud[viewDay]) {
      const m = new Map(); cloud[viewDay].forEach(o => m.set(o.id, o)); list.forEach(o => m.set(o.id, o));
      const pendDel = new Set(queue.filter(q => q.op === 'del').map(q => q.order.id));
      list = [...m.values()].filter(o => !pendDel.has(o.id));
    }
    dayOrders = list.slice().sort((a,b) => a.ts - b.ts); renderStats(); setSync();
  }
  function saveProducts(){ if (!LS.set('products', products)) toast('儲存失敗'); configChanged(); }
  function saveOrder(order){
    const all = localDay(order.date); all.push(order);
    if (!setLocalDay(order.date, all)) throw new Error('local');
    if (sync) { queue.push({ op:'add', order }); saveQueue(); flush(); }
    if (cloud[order.date]) cloud[order.date] = cloud[order.date].concat([order]);
    if (order.date === viewDay) refreshDay();
  }
  function deleteOrder(o){
    setLocalDay(o.date, localDay(o.date).filter(x => x.id !== o.id));
    if (cloud[o.date]) cloud[o.date] = cloud[o.date].filter(x => x.id !== o.id);
    if (sync) {
      const i = queue.findIndex(q => q.op === 'add' && q.order.id === o.id);
      if (i >= 0 && !flushing) queue.splice(i, 1); else queue.push({ op:'del', order:{ id:o.id, date:o.date } });
      saveQueue(); flush();
    }
    refreshDay();
  }
  function watchDay(){ refreshDay(); if (useCloudStats()) loadCloudDay(viewDay); }

  // ---------- cloud sync (Google 試算表) ----------
  let sync = LS.get('sync', null);       // {url,key,role,name,dev,staffKey}
  let queue = LS.get('queue', []);       // pending ops {op:'add'|'del', order}
  let configDirty = LS.get('configDirty', false);
  let flushing = false, flushAgain = false, retryT = null, syncErr = '', lastSync = LS.get('lastSync', 0);
  let cloud = {};                        // date -> orders from all phones (owner only)
  let cloudLoading = {}, cloudErr = {}, statSrc = 'cloud';
  const isStaff = () => !!(sync && sync.role === 'staff');
  const isAdmin = () => !!(sync && sync.role === 'admin');
  const useCloudStats = () => isAdmin() && statSrc === 'cloud';
  function saveQueue(){ LS.set('queue', queue); setSync(); }
  function configChanged(){
    if (!isAdmin()) return;
    configDirty = true; LS.set('configDirty', true); flush();
  }
  async function api(action, extra, override){
    const s = override || sync;
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
    try {
      const r = await fetch(s.url, { method:'POST', body: JSON.stringify(Object.assign({ action, key: s.key, dev: s.dev }, extra || {})), signal: ctl.signal });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '同步失敗');
      return j;
    } catch(e) {
      if (e.name === 'AbortError') throw new Error('連線逾時');
      if (e instanceof TypeError) throw new Error('連不上網路或網址錯誤');
      throw e;
    } finally { clearTimeout(t); }
  }
  function buildConfig(){ return { v: Date.now(), products, cats, shifts }; }
  function applyConfig(c){
    if (!c || !c.products) return false;
    if (c.v && c.v === LS.get('configV', 0)) return false;
    products = c.products; cats = c.cats || []; shifts = (c.shifts && c.shifts.length) ? c.shifts : shifts;
    LS.set('products', products); LS.set('cats', cats); LS.set('shifts', shifts); LS.set('configV', c.v || 0);
    if (!shifts.some(x => x.id === curShift) && !cart.length) { curShift = shifts[0].id; LS.set('curShift', curShift); }
    renderAll(); return true;
  }
  async function flush(){
    if (!sync) return;
    if (flushing) { flushAgain = true; return; }
    flushing = true; clearTimeout(retryT); setSync();
    try {
      if (isAdmin()) {   // 老闆每次同步都重新確認密碼並取得最新的員工密碼
        const h = await api('hello');
        if (h.staffKey && h.staffKey !== sync.staffKey) { sync.staffKey = h.staffKey; LS.set('sync', sync); }
      }
      if (isAdmin() && configDirty) {
        await api('setConfig', { config: buildConfig() });
        configDirty = false; LS.set('configDirty', false);
      }
      while (queue.length) {
        const n = Math.min(queue.length, 40);
        await api('push', { ops: queue.slice(0, n) });
        queue.splice(0, n); saveQueue();
      }
      if (isStaff()) { const j = await api('getConfig'); if (applyConfig(j.config)) toast('商品已更新'); }
      syncErr = ''; lastSync = Date.now(); LS.set('lastSync', lastSync);

  function csvAll(data){
    const rows = [['日期','時間','班別','單號','品項','單價','數量','小計','整單合計']];
    Object.keys(data.days).sort().forEach(d => data.days[d].slice().sort((a,b)=>a.ts-b.ts).forEach(o => {
      const t = new Date(o.ts), hm = pad(t.getHours()) + ':' + pad(t.getMinutes());
      const sn = o.shiftName || shiftName(shiftOf(o)); o.items.forEach(i => rows.push([d, hm, sn, o.id, i.name, i.price, i.qty, i.price*i.qty, o.total]));
    }));
    return '﻿' + rows.map(r => r.map(c => { c = String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c; }).join(',')).join('\n');

  async function shareFile(name, text, type){

      catch(e){ if (e && e.name === 'AbortError') return false; }

      </tbody></table>
      <button class="btn sec" id="copySum" style="margin-top:10px">複製統計文字</button>
      <div class="sec-t">每筆明細（新到舊）</div>
      ${list.slice().reverse().map(o => {
        const t = new Date(o.ts);
        return `<div class="order"><div class="top"><span>${pad(t.getHours())}:${pad(t.getMinutes())}${!statShift && present.length > 1 ? ' · ' + esc(nameOf(shiftOf(o))) : ''}${o.by && people.length > 1 ? ' · ' + esc(o.by) : ''}</span><span>${money(o.total)}</span></div>
          <div class="its">${o.items.map(i => esc(i.name) + ' ×' + i.qty).join('、')}${o.change > 0 ? ` · 收 ${money(o.paid)} 找 ${money(o.change)}` : ''}</div>
          ${isAdmin() || localIds.has(o.id) ? `<button class="del" data-id="${o.id}">${pendingDel === o.id ? '確定刪除？再按一次' : '刪除這筆'}</button>` : ''}</div>`;
      }).join('')}`;
    bindChips();
    el.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      const id = b.dataset.id;
      if (pendingDel !== id) { pendingDel = id; renderStats(); setTimeout(() => { if (pendingDel === id) { pendingDel = null; renderStats(); } }, 4000); return; }
      pendingDel = null;
      const o = dayOrders.find(x => x.id === id);
      deleteOrder(o); toast('已刪除');
    });
    $('#copySum').onclick = async () => {
      const txt = `${viewDay}${statShift ? ' ' + nameOf(statShift) : ''} 營業統計\n營業額 ${money(revenue)}｜${list.length} 筆｜${qty} 件\n` +
        rows.map(r => `${r.name} ×${r.qty}  ${money(r.amt)}`).join('\n');
      try { await navigator.clipboard.writeText(txt); toast('已複製'); } catch(e){ toast('無法複製，請手動截圖'); }
    };
  }

  // ---------- shifts (班別) ----------
  let shifts = [], curShift = '', legacyShift = '', statShift = '';
  function loadShifts(){
    shifts = LS.get('shifts', null);
    if (!shifts) {
      const first = { id: uid(), name: '鮪魚班' };
      shifts = [first];
      products.forEach(p => { if (!p.shift) p.shift = first.id; });
      (cats || []).forEach(c => { if (!c.shift) c.shift = first.id; });
      LS.set('shifts', shifts); LS.set('products', products); LS.set('cats', cats);
      LS.set('legacyShift', first.id);
    }
    legacyShift = LS.get('legacyShift', shifts[0].id);
    curShift = LS.get('curShift', shifts[0].id);
    if (!shifts.some(x => x.id === curShift)) curShift = shifts[0].id;
  }
  function saveShifts(){ LS.set('shifts', shifts); configChanged(); }
  const shiftOf = o => o.shift || legacyShift;
  const shiftName = id => { const x = shifts.find(s => s.id === id); return x ? x.name : ''; };
  const myProducts = () => products.filter(p => p.shift === curShift);
  const myCats = () => cats.filter(c => c.shift === curShift);
  function setShift(id){
    if (id === curShift) return;
    if (cart.length) { toast('先結帳或清空本單，再切換班別'); return; }
    curShift = id; LS.set('curShift', id); lastCat = '';
    renderShiftBars(); renderGrid(); renderCart(); renderProducts();
  }
  function renderShiftBars(){
    document.querySelectorAll('.shiftbar[data-bar]').forEach(bar => {
      bar.innerHTML = shifts.map(x => `<button class="chip ${x.id === curShift ? 'on' : ''}" data-shift="${x.id}">${esc(x.name)}</button>`).join('') +
        (bar.dataset.bar === 'prod' || isStaff() ? '' : '<button class="chip add" data-addshift>＋ 班別</button>');
      bar.querySelectorAll('[data-shift]').forEach(b => b.onclick = () => setShift(b.dataset.shift));
      const add = bar.querySelector('[data-addshift]');
      if (add) add.onclick = () => { document.querySelector('nav button[data-v=prod]').click(); setTimeout(() => { $('#nsName').scrollIntoView({ block:'center' }); $('#nsName').focus(); }, 50); };
    });
    renderShiftList();
  }
  let pendingS = null;
  function renderShiftList(){
    const el = $('#shiftlist');
    el.innerHTML = shifts.map(x => `<div class="sitem"><input value="${esc(x.name)}" data-sren="${x.id}" aria-label="班別名稱">
      ${shifts.length > 1 ? `<button class="x" data-sdel="${x.id}">${pendingS === x.id ? '連同商品刪除？' : '✕'}</button>` : ''}</div>`).join('');
    el.querySelectorAll('[data-sren]').forEach(inp => inp.onchange = () => {
      const x = shifts.find(s => s.id === inp.dataset.sren), v = inp.value.trim();
      if (!v) { inp.value = x.name; return; }
      x.name = v; saveShifts(); renderShiftBars(); renderStats(); toast('已改名');
    });
    el.querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => {
      const id = b.dataset.sdel;
      if (pendingS !== id) { pendingS = id; renderShiftList(); setTimeout(() => { if (pendingS === id) { pendingS = null; renderShiftList(); } }, 4000); return; }
      pendingS = null;
      if (id === curShift && cart.length) { toast('先結帳或清空本單'); return; }
      shifts = shifts.filter(s => s.id !== id);
      products = products.filter(p => p.shift !== id);
      cats = cats.filter(c => c.shift !== id);
      if (curShift === id) { curShift = shifts[0].id; LS.set('curShift', curShift); }
      if (statShift === id) statShift = '';
      saveShifts(); saveCats(); saveProducts();
      renderShiftBars(); renderGrid(); renderProducts(); renderStats(); toast('班別已刪除（過去的成交紀錄保留）');
    });
  }
  $('#newshift').onsubmit = e => {
    e.preventDefault();
    const name = $('#nsName').value.trim();
    if (!name) { toast('請輸入班別名稱'); return; }
    if (cart.length) { toast('先結帳或清空本單'); return; }
    const ns = { id: uid(), name };
    if ($('#nsCopy').checked) {
      const map = {};
      myCats().forEach(c => { const nc = { id: uid(), name: c.name, shift: ns.id }; map[c.id] = nc.id; cats.push(nc); });
      myProducts().forEach(p => products.push({ id: uid(), name: p.name, price: p.price, cat: map[p.cat], shift: ns.id }));
    }
    shifts.push(ns); saveShifts(); saveCats(); saveProducts();
    $('#nsName').value = '';
    curShift = ns.id; LS.set('curShift', ns.id); lastCat = '';
    renderShiftBars(); renderGrid(); renderCart(); renderProducts();
    try { window.scrollTo(0, 0); } catch(e){}
    toast(`已新增「${name}」`);
  };

  // ---------- sections (區塊) ----------
  let cats = null;   // [{id,name}]
  function loadCats(){
    cats = LS.get('cats', null);
    if (cats) return;
    cats = [];
    // first run of this version: group existing products the way they were arranged
    const norm = t => String(t).replace(/（/g,'(').replace(/）/g,')').replace(/\s+/g,'').toLowerCase();
    const preset = [
      ['出船', ['釣手','觀光']],
      ['套組', ['新手包','電捲(整組)','手捲(整組)']],
      ['單品', ['電捲(單)','手捲(單)','釣竿(單)','船竿架']],
      ['配件', ['鐵板(500g)','鐵板(400g)','天秤(300)','天秤(200)','天秤(100)','弓角']]
    ];
    preset.forEach(([name, list]) => {
      const set = new Set(list.map(norm));
      const hit = products.filter(p => set.has(norm(p.name)));
      if (!hit.length) return;
      const c = { id: uid(), name }; cats.push(c);
      hit.forEach(p => p.cat = c.id);
    });
    // keep product order grouped by section
    if (cats.length) products.sort((a,b) => catIndex(a) - catIndex(b));
    LS.set('cats', cats); LS.set('products', products);
  }
  function catIndex(p){ const i = cats.findIndex(c => c.id === p.cat); return i < 0 ? 999 : i; }
  function saveCats(){ LS.set('cats', cats); configChanged(); }
  function sections(){
    const cs = myCats(), ps = myProducts();
    const out = cs.map(c => ({ cat:c, items: ps.filter(p => p.cat === c.id) }));
    const loose = ps.filter(p => !cs.some(c => c.id === p.cat));
    if (loose.length || !cs.length) out.push({ cat:{ id:'', name:'未分類' }, items: loose });
    return out;
  }
  let lastCat = '';
  function catOptions(sel){
    const cs = myCats();
    return cs.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('') +
      `<option value="" ${!sel || !cs.some(c => c.id === sel) ? 'selected' : ''}>未分類</option>`;
  }

  // ---------- products ----------
  $('#pform').onsubmit = e => {
    e.preventDefault();
    const name = $('#pName').value.trim();
    const price = Number(String($('#pPrice').value).replace(/[^\d.]/g,''));
    if (!name || !price) { toast('請輸入名稱和價格'); return; }
    const cat = $('#pCat').value; lastCat = cat;
    // insert after the last product of the same section
    const cs = myCats();
    let at = -1; products.forEach((p,i) => { if (p.shift === curShift && ((p.cat || '') === cat || (!cat && !cs.some(c => c.id === p.cat)))) at = i; });
    products.splice(at < 0 ? products.length : at + 1, 0, { id: uid(), name, price, cat: cat || undefined, shift: curShift });
    $('#pName').value = ''; $('#pPrice').value = ''; $('#pName').focus();
    saveProducts(); renderProducts(); renderGrid();
  };
  function renderProducts(){
    $('#pCat').innerHTML = catOptions(lastCat);
    const el = $('#plist');
    const secs = sections();
    el.innerHTML = secs.map((x, si) => {
      const head = x.cat.id
        ? `<div class="cat-h"><input value="${esc(x.cat.name)}" data-rename="${x.cat.id}" aria-label="區塊名稱">
            <button data-cup="${x.cat.id}" ${si===0?'disabled style="opacity:.3"':''}>↑</button>
            <button class="x" data-cdel="${x.cat.id}">${pendingC === x.cat.id ? '刪除區塊？' : '✕'}</button></div>`
        : `<div class="cat-h"><span>未分類</span></div>`;
      const rows = x.items.map((p, k) => `<div class="pitem" data-id="${p.id}">
        <button class="mv" data-up="${p.id}" ${k===0?'disabled style="opacity:.3"':''}>↑</button>
        <input class="nmi" value="${esc(p.name)}" data-f="name">
        <input class="pri" value="${p.price}" inputmode="numeric" data-f="price">
        <select data-mv="${p.id}" aria-label="移到區塊">${catOptions(p.cat)}</select>
        <button class="x" data-x="${p.id}">${pendingP === p.id ? '確定' : '✕'}</button></div>`).join('');
      return head + (rows || '<div style="color:var(--mute);font-size:13px;padding:4px 6px 8px">這個區塊還沒有商品</div>');
    }).join('') +
      `<form class="addcat" id="addcat"><input id="newCat" placeholder="新區塊名稱" autocomplete="off"><button type="submit">＋ 新增區塊</button></form>
       <div style="color:var(--mute);font-size:13px;padding:8px 4px">點區塊名稱可以直接改名；商品右邊的選單可以換區塊。改完點別處即儲存，已結帳的紀錄不受影響。</div>`;

    const byId = id => products.find(p => p.id === id);
    el.querySelectorAll('.pitem input').forEach(inp => inp.onchange = () => {
      const p = byId(inp.closest('.pitem').dataset.id), f = inp.dataset.f;
      if (f === 'price') { const v = Number(inp.value.replace(/[^\d.]/g,'')); if (!v) { inp.value = p.price; return; } p.price = v; }
      else { const v = inp.value.trim(); if (!v) { inp.value = p.name; return; } p.name = v; }
      saveProducts(); renderGrid(); toast('已儲存');
    });
    el.querySelectorAll('[data-mv]').forEach(sel => sel.onchange = () => {
      const p = byId(sel.dataset.mv);
      products = products.filter(x => x !== p);
      p.cat = sel.value || undefined;
      let at = -1; products.forEach((q,i) => { if (q.shift === curShift && (q.cat || '') === (p.cat || '')) at = i; });
      products.splice(at < 0 ? products.length : at + 1, 0, p);
      saveProducts(); renderProducts(); renderGrid(); toast('已移動');
    });
    el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
      const p = byId(b.dataset.up);
      const sec = sections().find(x => x.items.includes(p)).items;
      const prev = sec[sec.indexOf(p) - 1]; if (!prev) return;
      const i = products.indexOf(p), j = products.indexOf(prev);
      [products[i], products[j]] = [products[j], products[i]];
      saveProducts(); renderProducts(); renderGrid();
    });
    el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      const p = byId(b.dataset.x);
      if (pendingP !== p.id) { pendingP = p.id; renderProducts(); setTimeout(() => { if (pendingP === p.id) { pendingP = null; renderProducts(); } }, 4000); return; }
      pendingP = null;
      products = products.filter(x => x.id !== p.id);
      saveProducts(); renderProducts(); renderGrid();
    });
    el.querySelectorAll('[data-rename]').forEach(inp => inp.onchange = () => {
      const c = cats.find(x => x.id === inp.dataset.rename), v = inp.value.trim();
      if (!v) { inp.value = c.name; return; }
      c.name = v; saveCats(); renderGrid(); renderProducts(); toast('已改名');
    });
    el.querySelectorAll('[data-cup]').forEach(b => b.onclick = () => {
      const i = cats.findIndex(c => c.id === b.dataset.cup);
      let j = i - 1; while (j >= 0 && cats[j].shift !== curShift) j--;
      if (j < 0) return;
      [cats[j], cats[i]] = [cats[i], cats[j]];
      saveCats(); renderProducts(); renderGrid();
    });
    el.querySelectorAll('[data-cdel]').forEach(b => b.onclick = () => {
      const id = b.dataset.cdel;
      if (pendingC !== id) { pendingC = id; renderProducts(); setTimeout(() => { if (pendingC === id) { pendingC = null; renderProducts(); } }, 4000); return; }
      pendingC = null;
      cats = cats.filter(c => c.id !== id);
      products.forEach(p => { if (p.cat === id) p.cat = undefined; });
      saveCats(); saveProducts(); renderProducts(); renderGrid(); toast('區塊已刪除，商品移到未分類');
    });
    $('#addcat').onsubmit = e => {
      e.preventDefault();
      const v = $('#newCat').value.trim(); if (!v) { toast('請輸入區塊名稱'); return; }
      const c = { id: uid(), name: v, shift: curShift }; cats.push(c); lastCat = c.id;
      saveCats(); renderProducts(); renderGrid(); toast('已新增區塊');
    };
  }
  let pendingC = null;
  let pendingP = null;

  // ---------- misc ----------
  let tt;
  function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2000); }
  function renderAll(){ renderShiftBars(); renderGrid(); renderCart(); renderProducts(); renderSyncBox(); }

  init();
})();
</script>
</body>
</html>
